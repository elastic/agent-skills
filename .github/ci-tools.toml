[sync.defaults]
branch = "automated/skill-sync"
commit_message = "chore: sync skills from agent-skills {version}"
pr_title = "chore: sync agent-skills {version}"
pr_body = "Automated sync from {source_repo} release {version}"

[[sync.target]]
name = "cursor"
repo = "elastic/cursor-plugins"

[[sync.target.copies]]
source = "skills"
dest = "elastic/skills"
exclude = ["**/.claude-plugin/**"]
preserve = [".git", "README.md", "**/plugin.json"]

[[sync.target.versions]]
file = "elastic/**/plugin.json"
field = "version"

[[sync.target]]
name = "claude"
repo = "elastic/claude-plugin"

[[sync.target.copies]]
source = "skills"
dest = "skills"

[[sync.target]]
name = "copilot-cowork"
repo = "elastic/copilot-cowork-plugin"

[[sync.target.copies]]
source = "skills"
dest = "skills"
exclude = ["security/**", "observability/**"]

# Agent Plugins 1.0 package: the spec requires skills/<name>/ at the plugin
# root, so the synced tree is flattened by frontmatter name.
[[sync.target]]
name = "agent-plugin"
repo = "elastic/agent-plugin"

[[sync.target.copies]]
source = "skills"
dest = "skills"
flatten = true
